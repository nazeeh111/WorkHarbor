name: Verify WorkHarbor
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: workharbor-${{ github.ref }}
  cancel-in-progress: true
jobs:
  helpers:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          package-manager-cache: false
          node-version: '24.14.0'
      - run: node --test scripts/workharbor-local.test.mjs scripts/change-packet.test.mjs scripts/check-workharbor-lifecycle.test.mjs
  board:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PAPERCLIP_TELEMETRY_DISABLED: '1'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          package-manager-cache: false
          node-version: '24.14.0'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter @paperclipai/shared build
      - run: pnpm check:token-gates
      - name: Verify board and responsive editor regressions
        run: >-
          pnpm --filter @paperclipai/ui exec vitest run
          src/components/OnboardingWizard.step.test.tsx
          src/components/SidebarAccountMenu.test.tsx src/App.test.tsx
          src/i18n/locale-validation.test.ts
          src/context/BreadcrumbContext.test.tsx src/pages/InviteLanding.test.tsx
          src/components/InlineEditor.test.tsx
          src/components/task-chat/TaskChatThreadView.performance.test.tsx
          src/components/task-chat/TaskMessageScroller.test.tsx
          src/lib/sentry.test.ts src/lib/sentry-package-version.test.ts
          src/components/SentryGate.test.tsx
      - run: pnpm --filter @paperclipai/ui typecheck
      - run: pnpm --filter @paperclipai/ui build
  mocked-run-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PAPERCLIP_TELEMETRY_DISABLED: '1'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          package-manager-cache: false
          node-version: '24.14.0'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm rebuild @embedded-postgres/linux-x64
      - run: pnpm --filter @paperclipai/plugin-sdk build
      - name: Require embedded PostgreSQL test support
        run: >-
          pnpm --filter @paperclipai/server exec node --import tsx --input-type=module -e
          'const { getEmbeddedPostgresTestSupport } = await import("./src/__tests__/helpers/embedded-postgres.ts"); const support = await getEmbeddedPostgresTestSupport(); if (!support.supported) throw new Error(support.reason || "Embedded PostgreSQL unavailable");'
      - name: Verify mocked run lifecycle without provider credentials
        run: pnpm --filter @paperclipai/server exec vitest run src/__tests__/heartbeat-stale-queue-invalidation.test.ts src/__tests__/native-session-resumption.test.ts src/__tests__/heartbeat-workspace-branch-containment.test.ts --reporter=default --reporter=json --outputFile=workharbor-lifecycle.json
      - name: Require all lifecycle tests to execute
        run: node scripts/check-workharbor-lifecycle.mjs server/workharbor-lifecycle.json
      - name: Verify AgentMail signatures and durable email intake
        run: >-
          pnpm --filter @paperclipai/server exec vitest run
          src/__tests__/agentmail-api.test.ts
          src/__tests__/email-channels.integration.test.ts
